<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover hands the notch and the home indicator to CSS, which
         pads around them with env(safe-area-inset-*). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fffaf1" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#171e2a" />
    <meta
      name="description"
      content="SatzWerk - a personal German tutor built around actively producing German."
    />
    <title>SatzWerk</title>

    <!-- Added to the home screen, it opens without browser chrome and keeps
         its own history, which is what makes it feel like an app. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SatzWerk" />
    <link rel="apple-touch-icon" href="/icon-180.png" />

    <link rel="icon" href="/dackel.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
